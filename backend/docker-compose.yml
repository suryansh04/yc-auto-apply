services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: yc
      POSTGRES_PASSWORD: yc
      POSTGRES_DB: ycautoapply
    ports: ["5433:5432"]   # host 5433, so a native Postgres on 5432 is never in the way (Task 1 ruling / FR-2)
    volumes: ["pgdata:/var/lib/postgresql/data"]
volumes:
  pgdata:
